<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Helvetica, Arial, sans-serif">
  <title>Visitor Counter Block Diagram</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="760" height="380" fill="#ffffff"/>

  <!-- connecting lines: inputs -> MCU -->
  <line x1="240" y1="68"  x2="300" y2="196" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="188" x2="300" y2="204" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="308" x2="300" y2="214" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- connecting lines: MCU -> outputs -->
  <line x1="500" y1="196" x2="560" y2="68"  stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="205" x2="560" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="214" x2="560" y2="308" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- IR Sensor Entry -->
  <rect x="40" y="40" width="200" height="56" rx="8" fill="#fde3e0" stroke="#c0392b" stroke-width="1"/>
  <text x="140" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#7a2418">IR Sensor (Entry)</text>
  <text x="140" y="82" text-anchor="middle" font-size="12" fill="#7a2418">P0.14 / EINT1</text>

  <!-- IR Sensor Exit -->
  <rect x="40" y="160" width="200" height="56" rx="8" fill="#fde3e0" stroke="#c0392b" stroke-width="1"/>
  <text x="140" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#7a2418">IR Sensor (Exit)</text>
  <text x="140" y="202" text-anchor="middle" font-size="12" fill="#7a2418">P0.16 / EINT0</text>

  <!-- Switch -->
  <rect x="40" y="280" width="200" height="56" rx="8" fill="#fde3e0" stroke="#c0392b" stroke-width="1"/>
  <text x="140" y="302" text-anchor="middle" font-size="15" font-weight="600" fill="#7a2418">Switch</text>
  <text x="140" y="322" text-anchor="middle" font-size="12" fill="#7a2418">P0.17</text>

  <!-- MCU -->
  <rect x="300" y="160" width="200" height="90" rx="8" fill="#eae1f7" stroke="#6c3fa8" stroke-width="1"/>
  <text x="400" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#3d1f63">LPC2129 MCU</text>
  <text x="400" y="219" text-anchor="middle" font-size="12" fill="#3d1f63">ARM7TDMI-S</text>

  <!-- LCD -->
  <rect x="560" y="40" width="160" height="56" rx="8" fill="#dcf1ef" stroke="#1a7a72" stroke-width="1"/>
  <text x="640" y="62" text-anchor="middle" font-size="15" font-weight="600" fill="#0f4a45">LCD (8-bit)</text>
  <text x="640" y="82" text-anchor="middle" font-size="12" fill="#0f4a45">P1.16 - P1.26</text>

  <!-- LED1 -->
  <rect x="560" y="160" width="160" height="56" rx="8" fill="#fdeecb" stroke="#a86b0a" stroke-width="1"/>
  <text x="640" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#5c3d06">LED1 - Occupancy</text>
  <text x="640" y="202" text-anchor="middle" font-size="12" fill="#5c3d06">P0.10</text>

  <!-- LED2 -->
  <rect x="560" y="280" width="160" height="56" rx="8" fill="#fdeecb" stroke="#a86b0a" stroke-width="1"/>
  <text x="640" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#5c3d06">LED2 - Entry blink</text>
  <text x="640" y="322" text-anchor="middle" font-size="12" fill="#5c3d06">P0.11</text>
</svg>
